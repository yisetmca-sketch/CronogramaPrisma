function applyGridLayout() {
  const full = tableWidth(columnSet, colWidths());
  $('#grid-table').style.width = `${full}px`;
  const th = $('#grid-head th[data-col="name"]');
  if (th) th.style.width = `${colWidth('name', colWidths())}px`;
  const avail = $('.workspace').clientWidth - $('#splitter').offsetWidth;
  const want = layout.gridWidth == null ? full : Math.min(layout.gridWidth, full);
  const max = avail > 0 ? Math.max(avail - GANTT_MIN, GRID_MIN) : want;
  const w = clampNum(want, Math.min(GRID_MIN, full), max);
  $('#grid-pane').style.width = `${w}px`;
  ganttHeader.style.marginRight = `${Math.max(ganttBody.offsetWidth - ganttBody.clientWidth, 0)}px`;
  ganttHeader.scrollLeft = ganttBody.scrollLeft;
  const resizer = $('#grid-head .col-resizer');
  if (resizer) resizer.setAttribute('aria-valuenow', String(colWidth('name', colWidths())));
  $('#splitter').setAttribute('aria-valuenow', String(Math.round(w)));
}
function resizeTo(kind, px) {
  if (kind === 'name') {
    const w = clampNum(Math.round(px), NAME_MIN, NAME_MAX);
    layout.nameWidth = w === COLUMN_DEFS.name[1] ? null : w;
  } else {
    const full = tableWidth(columnSet, colWidths());
    const w = clampNum(Math.round(px), GRID_MIN, full);
    layout.gridWidth = w >= full ? null : w; // panel completo = automático (sigue a la tabla)
  }
  applyGridLayout();
}

document.addEventListener('pointerdown', (e) => {

  if (!handle || e.button !== 0 || view !== 'cronograma') return;
  e.preventDefault();
  const kind = handle.dataset.resize, x0 = e.clientX, start = currentSize(kind);
  try { handle.setPointerCapture(e.pointerId); } catch { /* sin captura */ }
  handle.classList.add('active');
  document.body.classList.add('resizing');
  const move = (ev) => resizeTo(kind, start + ev.clientX - x0);
  const end = () => {
    handle.removeEventListener('pointermove', move);
    handle.removeEventListener('pointerup', end);
    handle.removeEventListener('pointercancel', end);
    handle.classList.remove('active');
    document.body.classList.remove('resizing');

// tooltip de la curva S: la línea vertical busca el corte más cercano
document.addEventListener('mousemove', (e) => {
  const tip = $('#sc-tip');
  if (!currentCurve || e.target.id !== 'sc-overlay') { if (!tip.hidden) { tip.hidden = true; const c = $('#sc-cross'); if (c) c.setAttribute('visibility', 'hidden'); } return; }
  const svg = e.target.ownerSVGElement;
  const box = svg.getBoundingClientRect();
  const pl = Number(svg.dataset.pl), pw = Number(svg.dataset.pw);
  const d0 = toDayNumber(currentCurve.from), span = Math.max(toDayNumber(currentCurve.to) - d0, 1);
  const day = d0 + ((e.clientX - box.left - pl) / pw) * span;
  const rows = sCurveRows(currentCurve);
  const near = rows.reduce((a, r) => (Math.abs(toDayNumber(r.date) - day) < Math.abs(toDayNumber(a.date) - day) ? r : a), rows[0]);
  const x = pl + ((toDayNumber(near.date) - d0) / span) * pw;
  const cross = $('#sc-cross');
  cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
  const lastReal = [...currentCurve.real].reverse().find((r) => r.date <= near.date);
  const line = (label, v, cls) => `<div class="tip-row"><span class="tip-key ${cls}"></span><b>${v === null || v === undefined ? '—' : esc(pct(v))}</b> ${esc(label)}</div>`;
  tip.innerHTML = `<div class="tip-date">${esc(longDate(near.date))}</div>`
    + (near.lb !== null && near.lb !== undefined ? line('esperado línea base', near.lb, 'sc-lb-key') : '')
    + (near.current !== null ? line('esperado fechas actuales', near.current, 'sc-cur-key') : '')
    + line(lastReal ? `real (corte ${lastReal.date.slice(8)}/${lastReal.date.slice(5, 7)})` : 'real (sin corte)', lastReal ? lastReal.real : null, 'sc-real-key');
  tip.hidden = false;
  tip.style.left = `${Math.min(e.clientX + 16, window.innerWidth - 260)}px`;
  tip.style.top = `${e.clientY + 12}px`;
});

/* ----------------------------------------------- archivos */
/** Aplica un cambio que mueve fechas; con línea base fijada lo registra en el historial (pide motivo, opcional). */
function commitReschedule(id, next, wantedStart = null) {
  let before = null, after = null;
  try { before = schedule(plan, calendar).tasks[id]; } catch { /* plan con error */ }
  try { after = schedule(next, calendar).tasks[id]; } catch { /* se mostrará el error */ }
  if (before && after && hasFixedBaseline(next) && (before.start !== after.start || before.finish !== after.finish)) {
    const t = plan.tasks.find((x) => x.id === id);
    const reason = prompt(`Reprogramación de "${t.name}": ${shortDate(before.start)} → ${shortDate(before.finish)}  ⇒  ${shortDate(after.start)} → ${shortDate(after.finish)}\nMotivo (opcional):`, '');
    if (reason === null) { render(); return; } // cancelado: no se aplica el cambio
    next = addReschedule(next, id, { at: todayIso(), prevStart: before.start, prevFinish: before.finish, start: after.start, finish: after.finish, reason: reason.trim() });
  }
  commit(next);
  if (wantedStart && after && after.start !== wantedStart && !after.isMilestone) {
    toast(`Sus predecesoras no permiten empezar el ${shortDate(wantedStart)}: el comienzo más temprano es el ${shortDate(after.start)}.`);
  }
}

function confirmDiscard(action) {
  if (!isDirty()) return true;
  return confirm(`Hay cambios sin guardar${fileMeta.name ? ` en "${fileMeta.name}"` : ' (este plan no está guardado en ningún archivo)'}. ¿${action} de todos modos?`);
}
function replacePlan(next, name, handle, saved) {
  collapsed.clear();
  multiSel.clear();
  selectedId = next.tasks[0] ? next.tasks[0].id : null;
  fileHandle = handle;
  setFileMeta(name, saved ? snapshot(next) : null);
  commit(next);
  run('goto-start');
}
function loadFileText(name, text, handle) {
  try {
    if (/\.xml$/i.test(name) || text.trimStart().startsWith('<')) {
      const { plan: imported, warnings } = importMsProjectXml(text);
      replacePlan(imported, null, null, false);
      if (warnings.length) showReport('Importación del XML', `Se importaron ${imported.tasks.length} tareas de "${name}". Revisa estos ajustes:`, warnings);
      else toast(`Se importaron ${imported.tasks.length} tareas de "${name}". Guárdalo con "Guardar como…".`);
    } else {
      replacePlan(parsePlanFile(text), name, handle, true);
      toast(`Abierto "${name}".`);
    }
  } catch (e) {
    if (e instanceof PlanFileError || e instanceof MsProjectImportError) showReport('No se pudo abrir el archivo', `"${name}"`, [e.message]);
    else throw e;
  }
}
async function cmdOpen(types) {
  if (!confirmDiscard('Abrir otro archivo')) return;
  const f = await openFile(types);
  if (f) loadFileText(f.name, f.text, f.handle || null);
}
async function cmdSave(forceAs) {
  const text = serializePlan(plan);
  if (fileHandle && !forceAs) {
    await writeToHandle(fileHandle, text);
    setFileMeta(fileHandle.name, snapshot(plan));
    toast(`Guardado en "${fileHandle.name}".`);
    render();
    return;
  }
  const suggested = fileMeta.name && /\.json$/i.test(fileMeta.name) ? fileMeta.name : fileNameFor(plan.name, FILE_EXTENSION);
  const r = await saveFileAs(suggested, text, PLAN_TYPE, 'application/json');
  if (!r) return;
  fileHandle = r.handle;
  setFileMeta(r.name, snapshot(plan));
  toast(r.handle ? `Guardado en "${r.name}".` : `Descargado "${r.name}" (este navegador no permite guardar sobre el mismo archivo).`);
  render();
}
async function cmdExport(kind) {
  const { result } = compute();
  if (!result) { toast('Corrige el error del cronograma antes de exportar.'); return; }
  const r = kind === 'xml'
    ? await saveFileAs(fileNameFor(plan.name, '.xml'), exportMsProjectXml(plan, result, compareBaseline(), calendar), XML_TYPE, 'application/xml')
    : await saveFileAs(fileNameFor(plan.name, '.csv'), planToCsv(plan, result, computeProgress(plan, result, calendar, statusDate(), compareBaseline()), compareBaseline(), calendar), CSV_TYPE, 'text/csv');
  if (r) toast(kind === 'xml' ? `Exportado "${r.name}". Ábrelo en ProjectLibre o MS Project.` : `Exportado "${r.name}". Ábrelo con Excel.`);
}
function runAsync(promise) {
  promise.catch((e) => { console.error(e); showReport('Ocurrió un error con el archivo', '', [e && e.message ? e.message : String(e)]); });
}
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('#dropzone').hidden = false; } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropzone').hidden = true; });

  $('#dropzone').hidden = true;
  const file = e.dataTransfer && e.dataTransfer.files[0];

/* ----------------------------------------------- seleccionar, copiar y pegar filas
   Se copia el bloque con su estructura (copyTasks) a `taskClip` (memoria de la pestaña) y, con Ctrl+C, también al
   portapapeles del sistema: JSON en CLIP_MIME (Chromium lo conserva entre pestañas) + texto tabulado para Excel.
   Ctrl+V usa el JSON si viene; si no, `taskClip` mientras el portapapeles siga teniendo lo que copiamos.
   Dentro de inputs o con texto seleccionado en la página, Ctrl+C / Ctrl+V funcionan como siempre. */
const CLIP_MIME = 'application/x-planificador-tareas+json';
/** Filas seleccionadas en orden de filas (solo la activa si no hay selección múltiple). */
function selectedIds() {
  if (!selectedId) return [];
  if (multiSel.size > 1 && multiSel.has(selectedId)) return plan.tasks.filter((t) => multiSel.has(t.id)).map((t) => t.id);
  return [selectedId];
}
/** Shift+clic: rango desde la fila activa (en el orden visible); Ctrl/Cmd+clic: agrega o quita la fila. */
function extendSelection(id, range) {
  if (!selectedId) { selectedId = id; multiSel.clear(); return; }
  if (range) {
    const vis = visibleIndices().map((i) => plan.tasks[i].id);
    const a = vis.indexOf(selectedId), b = vis.indexOf(id);
    if (a < 0 || b < 0) return;
    multiSel = new Set(vis.slice(Math.min(a, b), Math.max(a, b) + 1));
    return;
  }
  const current = new Set(selectedIds());
  if (current.has(id)) {
    current.delete(id);
    if (!current.size) return; // siempre queda al menos una fila
    if (id === selectedId) selectedId = plan.tasks.filter((t) => current.has(t.id)).pop().id;
  } else { current.add(id); selectedId = id; }
  multiSel = current;
}
const isEditable = (el) => !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
/** Copiar/pegar filas solo en el cronograma, fuera de campos editables y sin texto seleccionado en la página. */
function rowClipboardActive(e) {
  if (view !== 'cronograma' || $('#report').open) return false;
  if (isEditable(e.target) || isEditable(document.activeElement)) return false;
  const s = window.getSelection && window.getSelection();
  return !(s && String(s).length);
}
/** Texto tabulado (nombre con sangría, duración, comienzo, fin, % real) para pegar en Excel u otra aplicación. */
function clipText(clip) {
  const { result } = compute();
  const level = new Map();
  return clip.tasks.map((t) => {
    const lv = t.parentId != null && level.has(t.parentId) ? level.get(t.parentId) + 1 : 0;
    level.set(t.id, lv);
    const s = result && result.tasks[t.id];
    return [`${'  '.repeat(lv)}${t.name}`, s ? s.duration : t.duration, s ? s.start : '', s ? s.finish : '', t.percentComplete || 0].join('\t');
  }).join('\r\n');
}
function copyRows() {
  const ids = selectedIds();
  if (!ids.length) return null;
  const clip = copyTasks(plan, ids);
  taskClip = { clip, text: clipText(clip), inSystem: false };
  $('[data-cmd="paste"]').disabled = false;
  const n = clip.tasks.length, extra = n - ids.length;
  toast(`${n === 1 ? 'Copiada 1 fila' : `Copiadas ${n} filas`}${extra > 0 ? ` (incluye ${extra} subtarea${extra > 1 ? 's' : ''})` : ''}. Selecciona la fila de abajo de la cual pegar y usa Ctrl+V.`);
  return taskClip;
}
function pasteRows(clip) {
  const ids = selectedIds();
  const after = ids.length ? plan.tasks.findIndex((t) => t.id === ids[ids.length - 1]) : -1;
  const r = pasteTasks(plan, clip, after >= 0 ? after : null);
  selectedId = r.ids[0];
  multiSel = new Set(r.ids);
  commit(r.plan);
  const n = r.ids.length;
  toast(`${n === 1 ? 'Pegada 1 tarea nueva' : `Pegadas ${n} tareas nuevas`}${r.dropped ? `. Se omitieron ${r.dropped} predecesora${r.dropped > 1 ? 's' : ''} que apuntaba${r.dropped > 1 ? 'n' : ''} a tareas que no están en este plan (o que ahora son resumen).` : '.'}`);
}
document.addEventListener('copy', (e) => {
  if (!rowClipboardActive(e) || !selectedIds().length) return;
  const c = copyRows();
  if (!c) return;
  e.preventDefault();
  try { e.clipboardData.setData('text/plain', c.text); e.clipboardData.setData(CLIP_MIME, JSON.stringify(c.clip)); c.inSystem = true; } catch { c.inSystem = false; }
});
document.addEventListener('paste', (e) => {
  if (!rowClipboardActive(e)) return;
  const data = e.clipboardData;
  let clip = null;
  try { const raw = data && data.getData(CLIP_MIME); if (raw) clip = parseTaskClip(JSON.parse(raw)); } catch { clip = null; }
  if (!clip && taskClip && (!taskClip.inSystem || (data && data.getData('text/plain') === taskClip.text))) clip = taskClip.clip;
  if (!clip) return; // no son filas del planificador: no se toca nada
  e.preventDefault();
  pasteRows(clip);
});
// con Shift o Ctrl/Cmd, el clic en una fila selecciona filas: no entra a editar la celda ni selecciona texto
document.addEventListener('mousedown', (e) => {
  if ((e.shiftKey || e.ctrlKey || e.metaKey) && view === 'cronograma' && e.target.closest && e.target.closest('#grid-rows tr[data-id], #gantt-body [data-id]')) {
    e.preventDefault();
    if (isEditable(document.activeElement)) document.activeElement.blur();
  }
});

/* ----------------------------------------------- comandos */
const selectedIndex = () => (selectedId ? plan.tasks.findIndex((t) => t.id === selectedId) : -1);
function setView(v) {
  view = VIEWS.includes(v) ? v : 'cronograma';
  if (location.hash.slice(1) !== view) history.replaceState(null, '', `#${view}`);
  render();
}
function run(cmd, el = null) {
  const idx = selectedIndex();
  $('#file-menu').open = false;
  switch (cmd) {
    case 'add': case 'milestone': {
      if (view !== 'cronograma') setView('cronograma');
      const r = insertTask(plan, idx >= 0 ? idx : null, cmd === 'milestone' ? 'Nuevo hito' : 'Nueva tarea', cmd === 'milestone' ? 0 : 1);
      selectedId = r.plan.tasks[r.index].id;
      pendingFocus = { index: r.index, field: 'name' };
      commit(r.plan);
      break;
    }
    case 'delete': {
      if (idx < 0) return;
      const t = plan.tasks[idx];
      if (hasChildren(plan, t.id) && !confirm(`"${t.name}" tiene subtareas. ¿Eliminarla con todas sus subtareas?`)) return;
      const next = deleteTask(plan, idx);
      selectedId = next.tasks[Math.min(idx, next.tasks.length - 1)] ? next.tasks[Math.min(idx, next.tasks.length - 1)].id : null;
      commit(next);
      break;
    }
    case 'indent': case 'outdent': {
      if (idx < 0) return;
      const next = cmd === 'indent' ? indentTask(plan, idx) : outdentTask(plan, idx);
      if (next === plan) { toast(cmd === 'indent' ? 'No se puede aplicar sangría: no hay una tarea hermana encima.' : 'La tarea ya está en el primer nivel.'); break; }
      const countDeps = (p) => p.tasks.reduce((n, t) => n + (t.dependencies || []).length, 0);
      const removed = countDeps(plan) - countDeps(next);
      const becameSummary = next.tasks.find((t) => hasChildren(next, t.id) && !hasChildren(plan, t.id));
      commit(next);
      if (removed > 0) toast(`"${becameSummary ? becameSummary.name : 'La tarea'}" pasó a ser tarea resumen: se quitaron ${removed} predecesora${removed > 1 ? 's' : ''}. Ponlas en sus subtareas.`);
      break;
    }
    case 'copy': {
      const c = copyRows();
      // también como texto en el portapapeles del sistema (si el navegador lo permite); pegar usa la copia en memoria
      if (c && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.text).then(() => { c.inSystem = true; }, () => {});
      break;
    }
    case 'paste':
      if (taskClip) pasteRows(taskClip.clip); else toast('Primero copia filas: selecciónalas y usa "Copiar" o Ctrl+C.');
      break;
    case 'up': case 'down': {
      if (idx < 0) return;
      const r = moveTask(plan, idx, cmd === 'up' ? -1 : 1);
      if (r.plan !== plan) commit(r.plan);
      break;
    }
    case 'sample':
      if (confirmDiscard('Cargar el ejemplo')) replacePlan(samplePlan(sampleStart()), null, null, true);
      break;
    case 'new':
      if (confirmDiscard('Crear un plan nuevo')) replacePlan(emptyPlan(calendar.nextWorkingDay(todayIso())), null, null, true);
      break;
    case 'open': runAsync(cmdOpen([PLAN_TYPE, XML_TYPE])); break;
    case 'import': runAsync(cmdOpen([XML_TYPE])); break;
    case 'save': runAsync(cmdSave(false)); break;
    case 'save-as': runAsync(cmdSave(true)); break;
    case 'export-xml': runAsync(cmdExport('xml')); break;
    case 'export-csv': runAsync(cmdExport('csv')); break;
    case 'print': setTimeout(() => window.print(), 50); break;
    case 'cut-today': { const next = clonePlan(plan); delete next.statusDate; commit(next); break; }
    case 'lb-create': {
      const { result } = compute();
      if (!result) { toast('Corrige el error del cronograma antes de crear la línea base.'); return; }
      let reason = '';
      if (baselinesOf(plan).length) {
        reason = prompt('Motivo de la nueva línea base (ej. cambio de alcance aprobado):', '');
        if (reason === null) return;
      }
      const next = createBaseline(plan, result, reason.trim());
      columnSet = 'lineabase';
      commit(next);
      toast(`LB ${draftBaseline(next).number} creada en borrador: revisa o ajusta sus fechas y pulsa "Fijar".`);
      break;
    }
    case 'lb-fix': {
      const d = draftBaseline(plan);
      if (!d || !confirm(`¿Fijar la LB ${d.number}? Después no se podrá modificar (sí podrás crear otra línea base).`)) return;
      compareId = null;
      commit(fixBaseline(plan));
      toast(`LB ${d.number} fijada. Ahora el avance se mide contra ella.`);
      break;
    }
    case 'lb-discard': {
      const d = draftBaseline(plan);
      if (!d || !confirm(`¿Descartar la LB ${d.number} en borrador?`)) return;
      commit(discardDraftBaseline(plan));
      break;
    }
    case 'cut-record': {
      const date = statusDate();
      if ((plan.cortes || []).some((c) => c.date === date) && !confirm(`Ya hay un corte el ${longDate(date)}. ¿Reemplazarlo con el avance actual?`)) return;
      commit(recordCut(plan, date));
      toast(`Corte del ${longDate(date)} registrado.`);
      break;
    }
    case 'cut-delete': {
      const date = el && el.dataset.date;
      if (date && confirm(`¿Quitar el corte del ${longDate(date)}?`)) commit(deleteCut(plan, date));
      break;
    }
    case 'goto-start': if (lastXOf) ganttBody.scrollLeft = Math.max(lastXOf(plan.startDate) - 40, 0); break;
    case 'goto-today': if (lastXOf) ganttBody.scrollLeft = Math.max(lastXOf(todayIso()) - 200, 0); break;
  }
}

document.addEventListener('click', (e) => {
  const target = e.target;
  const cmdEl = target.closest('[data-cmd]');
  if (cmdEl) { run(cmdEl.dataset.cmd, cmdEl); return; }
  const viewEl = target.closest('[data-view]');
  if (viewEl) { setView(viewEl.dataset.view); return; }
  if (!target.closest('#file-menu')) $('#file-menu').open = false;
  const row = target.closest('tr[data-id], [data-id]');
  const action = target.closest('[data-action]');
  if (action && row) {
    const id = row.dataset.id;
    if (action.dataset.action === 'toggle') { if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id); render(); }
    if (action.dataset.action === 'key') { const t = plan.tasks.find((x) => x.id === id); commit(updateTask(plan, id, { key: !t.key })); }
    if (action.dataset.action === 'history') {
      const t = plan.tasks.find((x) => x.id === id);
      showReport(`Reprogramaciones: ${t.name}`, `${(t.history || []).length} cambio(s) de fechas registrados.`,
        (t.history || []).map((h) => `${longDate(h.at)}: ${h.prevStart ? `${shortDate(h.prevStart)} → ${shortDate(h.prevFinish)}` : '—'}  ⇒  ${shortDate(h.start)} → ${shortDate(h.finish)}${h.reason ? ` · ${h.reason}` : ''}`));
    }
    return;
  }
  if (row && row.dataset.id && row.closest('#view-cronograma') && (e.shiftKey || e.ctrlKey || e.metaKey)) {
    extendSelection(row.dataset.id, e.shiftKey);
    render();
    return;
  }
  if (row && row.dataset.id && (row.dataset.id !== selectedId || multiSel.size) && row.closest('#view-cronograma')) {
    multiSel.clear();
    selectedId = row.dataset.id;
    if (target.dataset && target.dataset.field) pendingFocus = { index: Number(row.closest('tr') ? row.closest('tr').dataset.index : -1), field: target.dataset.field };
    render();
  }
});

document.addEventListener('change', (e) => {
  const input = e.target;
  if (input.id === 'project-name') { commit({ ...plan, name: input.value.trim() || 'Proyecto' }); return; }
  if (input.id === 'project-start') { if (isValidDate(input.value)) commit({ ...plan, startDate: input.value }); return; }
  if (input.id === 'status-date') { if (isValidDate(input.value)) commit({ ...plan, statusDate: input.value }); return; }
  if (input.id === 'zoom') { zoom = DAY_WIDTH[input.value] ? input.value : 'dias'; render(); return; }
  if (input.id === 'level') { boardOptions.level = input.value; render(); return; }
  if (input.id === 'progress-table') { boardOptions.progressTable = input.checked; render(); return; }
  if (input.id === 'only-key') { boardOptions.onlyKey = input.checked; render(); return; }
  if (input.id === 'milestone-table') { boardOptions.milestoneTable = input.checked; render(); return; }
  if (input.id === 'column-set') { columnSet = COLUMN_SETS[input.value] ? input.value : 'planificacion'; render(); return; }
  if (input.id === 'compare-lb') { compareId = input.value; render(); return; }
  if (input.id === 'curve-scope') { curveOptions.scope = input.value; render(); return; }
  if (input.id === 'curve-frequency') { curveOptions.frequency = input.value; render(); return; }
  if (input.id === 'curve-table') { curveOptions.table = input.checked; render(); return; }
  const field = input.dataset && input.dataset.field;
  const tr = input.closest && input.closest('tr');
  const id = tr && tr.dataset.id;
  if (!field || !id) return;
  const value = input.value;
  if (field === 'name') commit(updateTask(plan, id, { name: value.trim() || 'Sin nombre' }));
  else if (field === 'duration') {
    const n = Number(value);
    if (!Number.isInteger(n) || n < 0) { toast('La duración debe ser un número entero de días laborales (0 = hito).'); render(); return; }
    commitReschedule(id, updateTask(plan, id, { duration: n }));
  } else if (field === 'start') {
    if (value && !isValidDate(value)) { render(); return; }
    const next = updateTask(plan, id, { startNoEarlierThan: value || undefined });
    commitReschedule(id, next, value ? calendar.nextWorkingDay(value) : null);
  } else if (field === 'finish') {
    const s = compute().result && compute().result.tasks[id];
    if (!s || !isValidDate(value)) { render(); return; }
    const n = calendar.workingDaysBetween(s.start, value);
    if (n < 1) { toast(`El fin no puede ser antes del comienzo (${shortDate(s.start)}).`); render(); return; }
    commitReschedule(id, updateTask(plan, id, { duration: n }));
  } else if (field === 'lbstart' || field === 'lbfinish') {
    const d = draftBaseline(plan);
    const b = d && d.tasks[id];
    if (!b || !isValidDate(value)) { render(); return; }
    try {
      if (field === 'lbstart') {
        const start = calendar.nextWorkingDay(value); // mover el inicio conserva la duración de la línea base
        commit(setBaselineDates(plan, id, start, calendar.dateAt(start, Math.max(b.duration - 1, 0)), calendar));
      } else {
        commit(setBaselineDates(plan, id, b.duration === 0 ? value : b.start, value, calendar));
      }
    } catch (err) {
      if (!(err instanceof BaselineError)) throw err;
      toast(err.message);
      render();
    }
  } else if (field === 'pct') {
    const n = Math.round(Number(value));
    commit(updateTask(plan, id, { percentComplete: Number.isFinite(n) ? Math.min(Math.max(n, 0), 100) : 0 }));
  } else if (field === 'pred') {
    try {
      const deps = parsePredecessors(value, (row) => (plan.tasks[row - 1] ? plan.tasks[row - 1].id : undefined));
      if (deps.some((d) => d.predecessorId === id)) throw new PredecessorSyntaxError('Una tarea no puede depender de sí misma');
      if (deps.some((d) => hasChildren(plan, d.predecessorId))) throw new PredecessorSyntaxError('No se puede depender de una tarea resumen; usa una de sus subtareas');
      commit(updateTask(plan, id, { dependencies: deps }));
    } catch (err) {
      if (!(err instanceof PredecessorSyntaxError)) throw err;
      toast(err.message);
      render();
    }
  }
});

document.addEventListener('keydown', (e) => {
  const input = e.target;
  const inCell = input.classList && input.classList.contains('cell');
  if (inCell && (e.key === 'Enter' || e.key === 'Escape')) {
    const tr = input.closest('tr');
    if (e.key === 'Enter' && tr) {
      const visible = visibleIndices();
      const nextIndex = visible[visible.indexOf(Number(tr.dataset.index)) + (e.shiftKey ? -1 : 1)];
      if (nextIndex != null) { pendingFocus = { index: nextIndex, field: input.dataset.field }; selectedId = plan.tasks[nextIndex].id; }
    }
    if (e.key === 'Escape') { render(); return; }
    input.blur();
    if (pendingFocus) render();
    e.preventDefault();
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (mod && key === 's') { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); run(e.shiftKey ? 'save-as' : 'save'); return; }
  if (mod && key === 'o') { e.preventDefault(); run('open'); return; }
  if (mod && e.key === 'Enter') { e.preventDefault(); run('add'); return; }
  if (e.altKey && e.shiftKey) {
    const map = { ArrowRight: 'indent', ArrowLeft: 'outdent', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) { e.preventDefault(); run(map[e.key]); return; }
  }
  if (!inCell && e.key === 'Delete' && selectedId && view === 'cronograma' && input.tagName !== 'INPUT') { e.preventDefault(); run('delete'); }
});
window.addEventListener('hashchange', () => setView(location.hash.slice(1)));
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (view !== 'cronograma') render(); else applyGridLayout(); }, 150); });

view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'cronograma';
render();
run('goto-start');

})();
</script>
</body>
